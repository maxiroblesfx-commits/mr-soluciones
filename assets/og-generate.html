<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;padding:20px;gap:16px;font-family:system-ui}
  canvas{border:1px solid #333;max-width:100%}
  button{background:#C9A227;border:none;padding:12px 28px;font-size:1rem;font-weight:700;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<button onclick="dl()">Descargar og.png</button>
<script>
const c = document.getElementById('og');
const x = c.getContext('2d');
const W = 1200, H = 630;

// Fondo navy
x.fillStyle = '#1F2A44';
x.fillRect(0, 0, W, H);

// Halo dorado top-right
const g1 = x.createRadialGradient(W, 0, 0, W, 0, 560);
g1.addColorStop(0, 'rgba(201,162,39,.28)');
g1.addColorStop(1, 'transparent');
x.fillStyle = g1;
x.fillRect(0, 0, W, H);

// Halo sutil bottom-left
const g2 = x.createRadialGradient(0, H, 0, 0, H, 360);
g2.addColorStop(0, 'rgba(201,162,39,.10)');
g2.addColorStop(1, 'transparent');
x.fillStyle = g2;
x.fillRect(0, 0, W, H);

// Línea decorativa dorada izquierda
x.fillStyle = '#C9A227';
x.fillRect(72, 160, 5, 310);

// Logo box "MR"
rr(x, 104, 170, 88, 88, 18);
x.fillStyle = '#C9A227';
x.fill();
x.fillStyle = '#1F2A44';
x.font = 'bold 40px system-ui,-apple-system,sans-serif';
x.textAlign = 'center';
x.textBaseline = 'middle';
x.fillText('MR', 148, 214);

// Nombre
x.fillStyle = '#ffffff';
x.font = 'bold 76px system-ui,-apple-system,sans-serif';
x.textAlign = 'left';
x.textBaseline = 'alphabetic';
x.fillText('MR Soluciones', 104, 350);

// Tagline dorado
x.fillStyle = '#C9A227';
x.font = '600 30px system-ui,-apple-system,sans-serif';
x.fillText('Sistemas de reserva y automatización a medida', 104, 404);

// Separador
x.fillStyle = 'rgba(201,162,39,.35)';
x.fillRect(104, 432, 520, 1.5);

// Trust badges
const badges = ['Prueba gratis 2 semanas', 'Sin permanencia', 'Listo en días'];
x.font = '500 22px system-ui,-apple-system,sans-serif';
badges.forEach((b, i) => {
  const bx = 104 + i * 190;
  // punto dorado
  x.fillStyle = '#C9A227';
  x.beginPath();
  x.arc(bx + 8, 468, 5, 0, Math.PI * 2);
  x.fill();
  // texto
  x.fillStyle = 'rgba(200,207,222,.85)';
  x.textAlign = 'left';
  x.fillText(b, bx + 20, 474);
});

// URL
x.fillStyle = 'rgba(174,182,200,.6)';
x.font = '500 20px system-ui,-apple-system,sans-serif';
x.textAlign = 'left';
x.fillText('mr-soluciones.netlify.app', 104, 548);

// Panel derecho — mockup minimalista
const px = 750, py = 130, pw = 360, ph = 370;
rr(x, px, py, pw, ph, 20);
x.fillStyle = 'rgba(255,255,255,.07)';
x.fill();
x.strokeStyle = 'rgba(255,255,255,.12)';
x.lineWidth = 1.5;
x.stroke();

// Header del mockup
rr(x, px, py, pw, 52, [20, 20, 0, 0]);
x.fillStyle = 'rgba(201,162,39,.18)';
x.fill();
x.fillStyle = '#C9A227';
x.font = 'bold 16px system-ui,-apple-system,sans-serif';
x.textAlign = 'left';
x.fillText('Reservá tu turno', px + 18, py + 31);
x.fillStyle = 'rgba(231,199,90,.9)';
x.font = 'bold 11px system-ui,-apple-system,sans-serif';
x.textAlign = 'right';
x.fillText('EN VIVO', px + pw - 18, py + 31);

// Slots
const slots = [
  {label:'Sábado 15:00 hs', tag:'Libre', bg:'rgba(26,122,69,.22)', tc:'#4ade80', tbc:'rgba(74,222,128,.2)'},
  {label:'Sábado 17:00 hs', tag:'Ocupado', bg:'rgba(178,59,59,.18)', tc:'#f87171', tbc:'rgba(248,113,113,.15)'},
  {label:'Domingo 16:00 hs', tag:'Elegido', bg:'rgba(201,162,39,.22)', tc:'#C9A227', tbc:'rgba(201,162,39,.25)'},
];
slots.forEach((s, i) => {
  const sy = py + 72 + i * 68;
  rr(x, px + 14, sy, pw - 28, 52, 12);
  x.fillStyle = s.bg;
  x.fill();
  x.fillStyle = 'rgba(255,255,255,.88)';
  x.font = '600 15px system-ui,-apple-system,sans-serif';
  x.textAlign = 'left';
  x.fillText(s.label, px + 30, sy + 31);
  // tag
  const tw = x.measureText(s.tag).width + 20;
  rr(x, px + pw - 28 - tw, sy + 14, tw, 24, 999);
  x.fillStyle = s.tbc;
  x.fill();
  x.fillStyle = s.tc;
  x.font = 'bold 11px system-ui,-apple-system,sans-serif';
  x.textAlign = 'center';
  x.fillText(s.tag, px + pw - 28 - tw/2, sy + 30);
});

// Botón confirmar
const by = py + ph - 58;
rr(x, px + 14, by, pw - 28, 42, 12);
x.fillStyle = '#25D366';
x.fill();
x.fillStyle = '#04361b';
x.font = 'bold 15px system-ui,-apple-system,sans-serif';
x.textAlign = 'center';
x.fillText('✓ Reserva confirmada — te llega por WhatsApp', px + pw/2, by + 26);

function rr(ctx, x, y, w, h, r) {
  if (typeof r === 'number') r = [r, r, r, r];
  ctx.beginPath();
  ctx.moveTo(x + r[0], y);
  ctx.lineTo(x + w - r[1], y);
  ctx.arcTo(x + w, y, x + w, y + r[1], r[1]);
  ctx.lineTo(x + w, y + h - r[2]);
  ctx.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
  ctx.lineTo(x + r[3], y + h);
  ctx.arcTo(x, y + h, x, y + h - r[3], r[3]);
  ctx.lineTo(x, y + r[0]);
  ctx.arcTo(x, y, x + r[0], y, r[0]);
  ctx.closePath();
}

function dl() {
  const a = document.createElement('a');
  a.download = 'og.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
