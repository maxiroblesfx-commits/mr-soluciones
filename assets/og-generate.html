<!DOCTYPE html>
<!--
  Fuente de la imagen de vista previa (og:image, 1200x630).
  No se abre a mano: se renderiza con Chrome headless y la captura ES assets/og.png.

    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
           --window-size=1200,630 --virtual-time-budget=6000 \
           --screenshot=assets/og.png assets/og-generate.html

  Antes esto era un <canvas> que posicionaba cada texto con coordenadas fijas;
  cuando un texto crecía se metía debajo del de al lado sin avisar. Con HTML+CSS
  el ancho de cada elemento lo define su propio contenido, así que el copy se
  puede editar libremente y nada se pisa.

  Requiere red la primera vez, para bajar la tipografía de Google Fonts. Sin red
  cae al stack del sistema y la imagen sale distinta: verificarla antes de subirla.
-->
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F2A44;
    --gold:#C9A227;
    --muted:rgba(200,207,222,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow:hidden;background:#000}

  /* Lienzo exacto de Open Graph. Chrome lo captura 1:1. */
  .og{
    position:relative;
    width:1200px;height:630px;
    background:var(--navy);
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    color:#fff;
    display:flex;align-items:center;
    padding:0 72px;
    gap:56px;
    overflow:hidden;
  }

  /* Halos dorados. El stop final repite el MISMO dorado con alfa 0:
     `transparent` es rgba(0,0,0,0) — negro — y degradar hacia negro
     ensucia el tono a oliva. */
  .og::before,.og::after{content:"";position:absolute;inset:0;pointer-events:none}
  .og::before{
    background:radial-gradient(760px 620px at 100% 0%,
      rgba(201,162,39,.30) 0%, rgba(201,162,39,.12) 38%, rgba(201,162,39,0) 72%);
  }
  .og::after{
    background:radial-gradient(520px 460px at 0% 100%,
      rgba(201,162,39,.13) 0%, rgba(201,162,39,0) 70%);
  }

  .col{position:relative;z-index:1}

  /* ── Columna izquierda ───────────────────────────────────── */
  .left{
    flex:1 1 0;min-width:0;
    border-left:5px solid var(--gold);
    padding-left:34px;
    display:flex;flex-direction:column;align-items:flex-start;
  }
  .mark{
    width:88px;height:88px;border-radius:20px;
    background:var(--gold);color:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:800;letter-spacing:.02em;
    margin-bottom:26px;
  }
  .name{
    font-size:76px;font-weight:800;line-height:1;
    letter-spacing:-.02em;
    margin-bottom:16px;
  }
  .tagline{
    color:var(--gold);
    font-size:27px;font-weight:600;line-height:1.25;
    letter-spacing:-.005em;
    white-space:nowrap;
    margin-bottom:22px;
  }
  .rule{
    width:100%;max-width:520px;height:1.5px;
    background:rgba(201,162,39,.35);
    margin-bottom:20px;
  }
  /* Flex + gap: el ancho de cada badge lo define su propio texto,
     así que no pueden pisarse por más que cambie el copy. */
  .badges{
    display:flex;flex-wrap:wrap;align-items:center;
    column-gap:22px;row-gap:10px;
    margin-bottom:34px;
  }
  .badge{
    display:flex;align-items:center;gap:9px;
    color:var(--muted);font-size:19px;font-weight:500;
    white-space:nowrap;
  }
  .badge::before{
    content:"";width:10px;height:10px;border-radius:50%;
    background:var(--gold);flex:none;
  }
  .url{color:rgba(174,182,200,.6);font-size:20px;font-weight:500}

  /* ── Mockup derecho ──────────────────────────────────────── */
  .panel{
    flex:0 0 360px;
    background:rgba(255,255,255,.07);
    border:1.5px solid rgba(255,255,255,.12);
    border-radius:20px;
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;height:52px;
    background:rgba(201,162,39,.18);
    color:var(--gold);font-size:16px;font-weight:700;
  }
  .live{color:rgba(231,199,90,.9);font-size:11px;font-weight:700;letter-spacing:.08em}
  .slots{padding:14px;display:flex;flex-direction:column;gap:16px}
  .slot{
    display:flex;align-items:center;justify-content:space-between;
    height:52px;padding:0 16px;border-radius:12px;
    font-size:15px;font-weight:600;color:rgba(255,255,255,.88);
  }
  .tag{
    font-size:11px;font-weight:700;
    padding:5px 11px;border-radius:999px;white-space:nowrap;
  }
  .s-free{background:rgba(26,122,69,.22)}
  .s-free .tag{color:#4ade80;background:rgba(74,222,128,.2)}
  .s-busy{background:rgba(178,59,59,.18)}
  .s-busy .tag{color:#f87171;background:rgba(248,113,113,.15)}
  .s-pick{background:rgba(201,162,39,.22)}
  .s-pick .tag{color:var(--gold);background:rgba(201,162,39,.25)}
  .confirm{
    margin:6px 14px 14px;height:42px;border-radius:12px;
    background:#25D366;color:#04361b;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;white-space:nowrap;
  }
</style>
</head>
<body>
<div class="og">

  <div class="col left">
    <div class="mark">MR</div>
    <div class="name">MR Soluciones</div>
    <div class="tagline">Sistemas de reserva y automatización a medida</div>
    <div class="rule"></div>
    <div class="badges">
      <span class="badge">Prueba gratis 2 semanas</span>
      <span class="badge">Sin permanencia</span>
      <span class="badge">Listo en días</span>
    </div>
    <div class="url">mr-soluciones.netlify.app</div>
  </div>

  <div class="col panel">
    <div class="panel-head"><span>Reservá tu turno</span><span class="live">EN VIVO</span></div>
    <div class="slots">
      <div class="slot s-free"><span>Sábado 15:00 hs</span><span class="tag">Libre</span></div>
      <div class="slot s-busy"><span>Sábado 17:00 hs</span><span class="tag">Ocupado</span></div>
      <div class="slot s-pick"><span>Domingo 16:00 hs</span><span class="tag">Elegido</span></div>
    </div>
    <div class="confirm">✓ Confirmada — te llega por WhatsApp</div>
  </div>

</div>
</body>
</html>
